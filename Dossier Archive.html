<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dossier Archive</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bordo:#4a0f1c;
  --bordo-dark:#2c0910;
  --paper:#ecdfc4;
  --paper-dark:#d6c39c;
  --ink:#2a1a14;
  --red:#9d1b24;
  --gold:#c9a45c;
  --font-mono:"Courier New",Courier,monospace;
  --font-type:"Special Elite","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:
    radial-gradient(ellipse at center,#5e1626 0%,var(--bordo) 45%,var(--bordo-dark) 100%);
  color:var(--ink);
  font-family:var(--font-mono);
  padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);
  min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.25;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.5'/></svg>");
}
.wrap{max-width:720px;margin:0 auto;padding:24px 0 60px;position:relative}
header{text-align:center;color:var(--paper);margin-bottom:24px}
header h1{font-family:var(--font-type);font-size:26px;letter-spacing:6px;margin:0 0 6px;text-transform:uppercase}
header p{margin:0;font-size:12px;letter-spacing:3px;color:var(--gold);opacity:.85}

.paper{
  position:relative;background:var(--paper);border-radius:3px;padding:22px 22px 26px;
  box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 60px rgba(120,80,30,.18);
  background-image:
    radial-gradient(circle at 20% 30%,rgba(255,255,255,.35) 0,transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(120,80,30,.12) 0,transparent 45%);
}
.paper::after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:3px;opacity:.35;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.4  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.6 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>");
}
.paper > *{position:relative}

.btn{
  font-family:var(--font-mono);font-size:13px;letter-spacing:2px;text-transform:uppercase;
  background:transparent;color:var(--paper);border:1px solid var(--gold);padding:10px 16px;cursor:pointer;
  transition:background .2s,color .2s;
}
.btn:hover{background:var(--gold);color:var(--bordo-dark)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--paper)}
.btn.primary:hover{background:#b82430;color:#fff}
.btn.danger{border-color:#7a1a1a;color:#e9b6b0}
.btn.danger:hover{background:#7a1a1a;color:#fff}
.toolbar{display:flex;justify-content:center;margin-bottom:22px}

.folder{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 16px;margin-bottom:12px;cursor:pointer;border:1px solid rgba(42,26,20,.25);
  background:var(--paper);box-shadow:0 4px 12px rgba(0,0,0,.3);position:relative;
}
.folder:hover{transform:translateY(-2px);transition:transform .15s}
.folder .code{font-weight:bold;font-size:16px;text-transform:uppercase;letter-spacing:2px}
.folder .meta{font-size:12px;opacity:.75;margin-top:4px}
.status{font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:4px 8px;border:2px solid var(--red);color:var(--red);transform:rotate(-4deg);white-space:nowrap}
.empty{text-align:center;color:var(--paper);opacity:.7;padding:40px 0;font-size:14px;letter-spacing:1px}

.stamp{
  position:absolute;top:18px;right:18px;font-family:var(--font-type);font-size:20px;letter-spacing:3px;
  color:var(--red);border:3px double var(--red);padding:4px 10px;transform:rotate(12deg);opacity:.8;pointer-events:none;
}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;opacity:.75}
.field input,.field select,.field textarea{
  width:100%;font-family:var(--font-mono);font-size:15px;color:var(--ink);background:rgba(255,255,255,.35);
  border:none;border-bottom:1px solid var(--ink);padding:8px 4px;outline:none;
}
.field textarea{min-height:120px;resize:vertical;line-height:1.5;border:1px solid rgba(42,26,20,.3);padding:8px}
.field input:focus,.field select:focus,.field textarea:focus{background:rgba(255,255,255,.6)}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row .field{flex:1;min-width:150px}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px}
.hdr .cls{font-size:11px;letter-spacing:3px;color:var(--red);font-weight:bold}
.hdr h2{margin:6px 0 0;font-family:var(--font-type);font-size:24px;text-transform:uppercase;letter-spacing:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin-bottom:16px}
.kv b{text-transform:uppercase;font-size:11px;letter-spacing:2px;opacity:.7;padding-top:2px}
.notes{white-space:pre-wrap;font-size:14px;line-height:1.6;border-top:1px dashed rgba(42,26,20,.4);padding-top:12px;min-height:60px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:22px}
.hidden{display:none!important}
.closed-stamp{color:#5a0f14}
:root{--font-mono:'IBM Plex Mono','Courier New',monospace;--font-type:'Oswald','Arial Narrow',Impact,sans-serif}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.1) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6) 100%);animation:flick 6s infinite}
@keyframes flick{0%,46%,54%,100%{opacity:1}48%{opacity:.8}50%{opacity:.95}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes blink{50%{opacity:.15}}
@keyframes slam{from{opacity:0;transform:scale(3.2) rotate(28deg)}to{opacity:.85;transform:scale(1) rotate(12deg)}}
#list-view,#form-view,#view-view{animation:rise .4s}
header h1{font-size:32px;letter-spacing:8px;text-shadow:0 0 18px rgba(201,164,92,.4)}
.emblem{width:64px;height:64px;display:block;margin:0 auto 10px;filter:drop-shadow(0 0 8px rgba(201,164,92,.5))}
.sys{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:11px;letter-spacing:2px;color:var(--gold)}
.dot{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:#e23b3b;box-shadow:0 0 8px #e23b3b;animation:blink 1.2s infinite}
.btn{font-weight:600}.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(#b3202b,#7d1219);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 4px 14px rgba(157,27,36,.55)}
.btn.ghost{color:var(--ink);border:2px solid var(--ink);background:rgba(255,255,255,.45)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.folder{margin-top:26px;padding:18px;border-radius:2px 8px 4px 4px;border:1px solid #8a6d3b;background:linear-gradient(#e8d3a0,#d8bb7e);box-shadow:0 8px 18px rgba(0,0,0,.5);animation:rise .5s both;animation-delay:calc(var(--i,0)*80ms);transition:transform .2s,box-shadow .2s}
.folder:nth-child(odd){transform:rotate(-.5deg)}.folder:nth-child(even){transform:rotate(.5deg)}
.folder:hover{transform:translateY(-4px) rotate(0);box-shadow:0 14px 26px rgba(0,0,0,.55),0 0 0 1px var(--gold)}
.folder::before{content:attr(data-no);position:absolute;top:-15px;left:14px;padding:2px 12px;font-size:11px;font-weight:600;letter-spacing:2px;background:#d8bb7e;border:1px solid #8a6d3b;border-bottom:0;border-radius:6px 6px 0 0}
.folder .code{font-family:var(--font-type);font-size:20px}
.s-ok{color:#2f6b3a;border-color:#2f6b3a}.s-warn{color:#a66a0a;border-color:#a66a0a}.s-off{color:#555;border-color:#555}
.paper::before{content:'';position:absolute;right:26px;bottom:22px;width:86px;height:86px;border-radius:50%;border:6px solid rgba(110,70,30,.15);box-shadow:inset 0 0 6px rgba(110,70,30,.2);pointer-events:none}
.hdr{border-bottom:3px double var(--ink)}
.stamp{font-size:22px;animation:slam .5s cubic-bezier(.2,1.5,.4,1) .35s both}
.top{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:16px}.top .kv{flex:1 1 220px;margin:0}
.photo{position:relative;width:104px;height:132px;background:#cdbb94;border:6px solid #f5ecd5;box-shadow:0 3px 9px rgba(0,0,0,.4);transform:rotate(-3deg);display:flex;align-items:flex-end;justify-content:center}
.photo::after{content:'';position:absolute;top:-14px;left:26px;width:46px;height:18px;background:rgba(214,190,120,.75);transform:rotate(-5deg)}
.photo svg{width:80%;fill:#6b5a3c;opacity:.6}
.notes{font-size:15px}
.redact{background:#111;color:#111;padding:0 3px;border-radius:2px;cursor:pointer;transition:all .3s;user-select:none}.redact.open{background:transparent;color:inherit}
.barcode{width:60%;height:28px;margin-top:20px;opacity:.7;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 9px,var(--ink) 9px 12px,transparent 12px 14px)}
#boot{position:fixed;inset:0;z-index:100;background:#12040a;color:var(--gold);display:flex;flex-direction:column;justify-content:center;padding:32px;transition:opacity .8s}
#boot pre{font:14px/1.8 var(--font-mono);margin:0;white-space:pre-wrap}
#boot small{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;opacity:.5;font-size:11px;letter-spacing:2px}
#boot{transition:opacity .8s,transform .8s,filter .8s}
#boot.off{opacity:0;pointer-events:none;transform:scale(1.2);filter:blur(8px)}
#snd{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:60;padding:6px 10px;font-size:10px;background:rgba(20,5,10,.7)}
.ripple{position:fixed;z-index:120;width:12px;height:12px;margin:-6px 0 0 -6px;border:2px solid var(--gold);border-radius:50%;pointer-events:none;animation:rip .7s ease-out forwards}
@keyframes rip{to{transform:scale(9);opacity:0}}
.mote{position:fixed;bottom:-10px;border-radius:50%;background:rgba(201,164,92,.6);pointer-events:none;z-index:1;animation:float linear infinite}
@keyframes float{to{transform:translate(var(--dx),-110vh);opacity:0}}
header h1{animation:glitch 6s infinite}
@keyframes glitch{0%,92%,100%{text-shadow:0 0 18px rgba(201,164,92,.4);transform:none}93%{text-shadow:-3px 0 #f0f,3px 0 #0ff;transform:translateX(3px) skewX(-6deg)}95%{text-shadow:3px 0 #f0f,-3px 0 #0ff;transform:translateX(-3px)}97%{text-shadow:0 0 18px rgba(201,164,92,.4);transform:none}}
.ring{transform-origin:32px 32px;animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.pup{transition:transform .12s}.p1{animation:pupil 2.4s ease-in-out infinite}@keyframes pupil{50%{fill:#e23b3b}}
.wrap.shake{animation:shake .35s}@keyframes shake{20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
.hdr h2{animation:reveal .9s steps(22) .2s both}@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.photo img{animation:develop 1.6s ease-out .5s both}@keyframes develop{from{filter:brightness(3) blur(10px) sepia(1);opacity:.2}}
.barcode{position:relative;overflow:hidden}.barcode::after{content:'';position:absolute;top:0;bottom:0;width:3px;background:#e23b3b;box-shadow:0 0 8px #e23b3b;animation:scan 2s ease-in-out infinite alternate}@keyframes scan{from{left:0}to{left:100%}}
.btn{position:relative;overflow:hidden}
.btn.primary::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 3.5s infinite}@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.s-bad{animation:pulse 1.6s infinite}@keyframes pulse{50%{box-shadow:0 0 12px rgba(157,27,36,.8)}}
.photo{width:120px;height:150px;cursor:pointer}.photo img{width:100%;height:100%;object-fit:cover;filter:sepia(.35) contrast(1.05)}
.photo small{position:absolute;left:0;right:0;bottom:0;padding:3px 2px;text-align:center;font-size:9px;letter-spacing:1px;background:rgba(20,5,10,.7);color:#f5ecd5}
@media(max-width:400px){header h1{font-size:26px;letter-spacing:5px}}
</style>
</head>
<body>
<button class="btn" id="snd"></button>
<div id="boot"><pre id="boot-text"></pre><small>tap to skip</small></div>
<div class="wrap">
  <header>
    <svg class='emblem' viewBox='0 0 64 64' fill='none' stroke='#c9a45c' stroke-width='2'><circle cx='32' cy='32' r='29'/><circle class='ring' cx='32' cy='32' r='24' stroke-dasharray='3 4'/><path d='M10 32q22-26 44 0q-22 26-44 0z'/><circle class='pup p1' cx='32' cy='32' r='7' fill='#9d1b24'/><circle class='pup' cx='32' cy='32' r='2.5' fill='#c9a45c'/></svg><h1>Dossier Archive</h1>
    <p>Top secret · Authorized eyes only</p><div class='sys'><span><i class='dot'></i>SYSTEM ACTIVE</span><span id='clock'>--:--:--</span><span id='count'>FILES IN ARCHIVE: 0</span><span id='sync'>LOCAL ONLY</span></div>
  </header>

  <div id="list-view">
    <div class="toolbar"><button class="btn primary" id="new-btn">+ New dossier</button></div>
    <div id="folders"></div>
  </div>

  <div id="form-view" class="hidden">
    <div class="paper">
      <div class="hdr">
        <div><div class="cls" id="form-title">NEW DOSSIER</div><h2 id="form-h">Open a case</h2></div>
      </div>
      <div class="row">
        <div class="field"><label>Codename</label><input id="f-code" maxlength="60" placeholder="e.g. RAVEN"></div>
        <div class="field"><label>Real name</label><input id="f-real" maxlength="80" placeholder="First Last"></div>
      </div>
      <div class="row">
        <div class="field"><label>Call sign</label><input id="f-alias" maxlength="60"></div>
        <div class="field"><label>Clearance level</label>
          <select id="f-level">
            <option>UNCLASSIFIED</option><option>CONFIDENTIAL</option><option>SECRET</option><option>TOP SECRET</option>
          </select>
        </div>
        <div class="field"><label>Status</label>
          <select id="f-status">
            <option>ALIVE</option><option>UNDER SURVEILLANCE</option><option>MISSING</option><option>CASE CLOSED</option>
          </select>
        </div>
      </div>
      <div class="field"><label>Last contact date</label><input id="f-contact" type="date"></div>
      <div class="field"><label>Notes</label><textarea id="f-notes" maxlength="5000" placeholder="Intel, observations, contacts... Text in [[double brackets]] will be redacted"></textarea></div>
      <div class="actions">
        <button class="btn ghost" id="cancel-btn">✕ Cancel</button>
        <button class="btn primary" id="save-btn">File it away</button>
      </div>
    </div>
  </div>

  <div id="view-view" class="hidden">
    <div class="paper" id="dossier-card"></div>
    <div class="actions" style="justify-content:center">
      <button class="btn" id="back-btn">← Back to archive</button>
      <button class="btn" id="edit-btn">Edit</button>
      <button class="btn danger" id="del-btn">Destroy</button>
    </div>
  </div>
</div>

<script>
const KEY = "dossier-archive-v1";
const SC={'ALIVE':'s-ok','UNDER SURVEILLANCE':'s-warn','MISSING':'s-bad','CASE CLOSED':'s-off'};
const M={'ОБЩИЙ':'UNCLASSIFIED','КОНФИДЕНЦИАЛЬНО':'CONFIDENTIAL','СЕКРЕТНО':'SECRET','ОСОБАЯ ВАЖНОСТЬ':'TOP SECRET','ЖИВ':'ALIVE','ПОД НАБЛЮДЕНИЕМ':'UNDER SURVEILLANCE','ПРОПАЛ':'MISSING','ДЕЛО ЗАКРЫТО':'CASE CLOSED'};
const redact=s=>esc(s).replace(/\[\[([\s\S]+?)\]\]/g,`<span class="redact" onclick="this.classList.toggle('open');sfx.reveal()">$1</span>`);
let AC=null,master=null,muted=false,amb=false;
try{muted=localStorage.getItem('snd')==='0'}catch(e){}
function ensure(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.8;master.connect(AC.destination)}if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f,d,type='sine',v=.2,to=null,at=0){if(!AC)return;const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
function noise(d,v=.2,f=2000,at=0,q=1){if(!AC)return;const t=AC.currentTime+at,n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(master);s.start(t)}
const sfx={
 key(){noise(.04,.25,3000+Math.random()*1500,0,2);tone(180+Math.random()*60,.04,'square',.04)},
 click(){tone(900,.05,'square',.05,500);noise(.03,.1,4000)},
 paper(){noise(.28,.18,1800,0,.6);noise(.2,.1,900,.08,.6)},
 stamp(){tone(130,.28,'sine',.7,35);noise(.12,.5,300);noise(.25,.2,1200,.02)},
 save(){tone(660,.18,'triangle',.12);tone(990,.3,'triangle',.12,null,.12)},
 shred(){noise(.7,.35,2500,0,.5);tone(300,.7,'sawtooth',.08,40)},
 reveal(){tone(500,.07,'square',.05,900)},
 shutter(){noise(.03,.5,5000);noise(.05,.4,2500,.07)},
 boot(){tone(70,2.4,'sawtooth',.07,500);tone(140,2.4,'sine',.12,900)},
 access(){tone(220,.5,'sawtooth',.1);[523,659,784,1047].forEach((f,i)=>tone(f,.5,'triangle',.14,null,i*.11));noise(.5,.15,5000,.1)}
};
function ambient(){if(amb||!AC)return;amb=true;const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();o.type='triangle';o.frequency.value=82;o2.type='sine';o2.frequency.value=123;g.gain.value=.03;l.frequency.value=.15;lg.gain.value=.015;l.connect(lg);lg.connect(g.gain);o.connect(g);o2.connect(g);g.connect(master);[o,o2,l].forEach(x=>x.start())}
const snd=document.getElementById('snd');
function syncSnd(){snd.textContent=muted?'🔇 SOUND OFF':'🔊 SOUND ON';if(master)master.gain.value=muted?0:.8}
snd.onclick=()=>{ensure();muted=!muted;try{localStorage.setItem('snd',muted?'0':'1')}catch(x){}syncSnd();if(!muted)sfx.click()};syncSnd();
addEventListener('pointerdown',e=>{ensure();if(!document.getElementById('boot'))ambient();const r=document.createElement('span');r.className='ripple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),700);if(e.target.closest('.btn:not(#snd)'))sfx.click();if(e.target.closest('.folder'))sfx.paper()});
addEventListener('input',e=>{if(e.target.matches('input,textarea'))sfx.key()});
addEventListener('pointermove',e=>{const em=document.querySelector('.emblem');if(!em)return;const r=em.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy)||1,k=Math.min(6,m/40);document.querySelectorAll('.pup').forEach(c=>c.style.transform=`translate(${dx/m*k}px,${dy/m*k}px)`)});
for(let i=0;i<22;i++){const m=document.createElement('span');m.className='mote';m.style.cssText=`left:${Math.random()*100}vw;--dx:${(Math.random()-.5)*120}px;animation-duration:${9+Math.random()*12}s;animation-delay:-${Math.random()*15}s;width:${2+Math.random()*3}px;height:${2+Math.random()*3}px`;document.body.appendChild(m)}
function tickClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-GB')}
setInterval(tickClock,1000);tickClock();
(function(){
  const b=document.getElementById('boot'),t=document.getElementById('boot-text');
  let seen=false;try{seen=sessionStorage.getItem('boot')==='1'}catch(e){}
  if(seen){b.remove();return}
  const L=['> INITIALIZING SECURE CHANNEL...','> CHECKING CLEARANCE... [OK]','> DECRYPTING ARCHIVE... [OK]','> WELCOME BACK, AGENT.'];
  let i=0,j=0,done=false;
  const end=()=>{if(done)return;done=true;try{sessionStorage.setItem('boot','1')}catch(e){}b.classList.add('off');ambient();setTimeout(()=>b.remove(),900)};
  let go=false;b.addEventListener('click',()=>{if(!go){go=true;ensure();sfx.boot()}else end()});
  (function tick(){
    if(done)return;
    if(!go){t.textContent=Date.now()%1000<650?'[ TAP TO AUTHENTICATE ]':' ';setTimeout(tick,250);return}if(i>=L.length){setTimeout(()=>{sfx.access();end()},700);return}
    t.textContent=L.slice(0,i).join('\n')+(i?'\n':'')+L[i].slice(0,++j)+'█';sfx.key();
    if(j>=L[i].length){i++;j=0;setTimeout(tick,350)}else setTimeout(tick,22)
  })();
})();
let dossiers = [];
let currentId = null;
let editingId = null;

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    dossiers = raw ? JSON.parse(raw) : [];
    if(!Array.isArray(dossiers)) dossiers = [];
    dossiers.forEach(d=>{d.level=M[d.level]||d.level;d.status=M[d.status]||d.status});
  }catch(e){ dossiers = []; }
}
function save(){
  if(DB){const d=dossiers.find(x=>x.id===currentId);if(d)DB.doc('dossiers/'+d.id).set(JSON.parse(JSON.stringify(d))).catch(e=>alert('Could not sync: '+(e&&e.message||e)));return}
  try{ localStorage.setItem(KEY, JSON.stringify(dossiers)); }
  catch(e){ alert("Could not save. Check your browser storage settings or free up space."); }
}
function today(){
  const d = new Date();
  const dd = String(d.getDate()).padStart(2,"0");
  const mm = String(d.getMonth()+1).padStart(2,"0");
  return `${dd}.${mm}.${d.getFullYear()}`;
}
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function show(id){
  ["list-view","form-view","view-view"].forEach(v => document.getElementById(v).classList.toggle("hidden", v !== id));
  window.scrollTo(0,0);
}

function renderList(){
  const box = document.getElementById("folders");
  document.getElementById('count').textContent='FILES IN ARCHIVE: '+dossiers.length;
  if(!dossiers.length){
    box.innerHTML = `<div class="empty">The archive is empty. Open your first case.</div>`;
    return;
  }
  const sorted = [...dossiers].sort((a,b)=> b.created - a.created);
  box.innerHTML = sorted.map((d,i) => `
    <div class="folder" data-id="${esc(d.id)}" data-no="№ ${esc(d.id.slice(-6).toUpperCase())}" style="--i:${i}">
      <div>
        <div class="code">${esc(d.code || "Unnamed")}</div>
        <div class="meta">Opened: ${esc(d.createdDate)} · Clearance: ${esc(d.level)}</div>
      </div>
      <div class="status ${SC[d.status]||''}">${esc(d.status)}</div>
    </div>`).join("");
  box.querySelectorAll(".folder").forEach(el => el.addEventListener("click", () => openView(el.dataset.id)));
}

function clearForm(){
  ["f-code","f-real","f-alias","f-contact","f-notes"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("f-level").value = "UNCLASSIFIED";
  document.getElementById("f-status").value = "ALIVE";
}
function openNew(){
  editingId = null;
  clearForm();
  document.getElementById("form-title").textContent = "NEW DOSSIER · " + today();
  document.getElementById("form-h").textContent = "Open a case";
  show("form-view");
}
function openEdit(id){
  const d = dossiers.find(x => x.id === id);
  if(!d) return;
  editingId = id;
  document.getElementById("f-code").value = d.code || "";
  document.getElementById("f-real").value = d.real || "";
  document.getElementById("f-alias").value = d.alias || "";
  document.getElementById("f-level").value = d.level || "UNCLASSIFIED";
  document.getElementById("f-status").value = d.status || "ALIVE";
  document.getElementById("f-contact").value = d.contact || "";
  document.getElementById("f-notes").value = d.notes || "";
  document.getElementById("form-title").textContent = "EDITING · Case opened " + d.createdDate;
  document.getElementById("form-h").textContent = d.code || "Unnamed";
  show("form-view");
}
function saveForm(){
  const code = document.getElementById("f-code").value.trim();
  const real = document.getElementById("f-real").value.trim();
  if(!code && !real){ alert("Enter at least a codename or a real name."); return; }
  const data = {
    code, real,
    alias: document.getElementById("f-alias").value.trim(),
    level: document.getElementById("f-level").value,
    status: document.getElementById("f-status").value,
    contact: document.getElementById("f-contact").value,
    notes: document.getElementById("f-notes").value
  };
  sfx.save();if(editingId){
    const d = dossiers.find(x => x.id === editingId);
    Object.assign(d, data);
    currentId = editingId;
  }else{
    const now = Date.now();
    const d = { id: now.toString(36) + Math.random().toString(36).slice(2,7), created: now, createdDate: today(), ...data };
    dossiers.push(d);
    currentId = d.id;
  }
  save();
  openView(currentId);
}
function openView(id){
  currentId = id;
  const d = dossiers.find(x => x.id === id);
  if(!d){ show("list-view"); renderList(); return; }
  const contact = d.contact ? d.contact.split("-").reverse().join(".") : "not established";
  document.getElementById("dossier-card").innerHTML = `
    <div class="stamp">${esc(d.level)}</div>
    <div class="hdr">
      <div>
        <div class="cls">CASE № ${esc(d.id.slice(-6).toUpperCase())}</div>
        <h2>${esc(d.code || "Unnamed")}</h2>
      </div>
    </div>
    <div class="top"><div class="photo" id="photo">${d.photo?`<img src="${d.photo}" alt="">`:`<svg viewBox="0 0 60 80"><circle cx="30" cy="26" r="13"/><path d="M6 80q0-28 24-28t24 28z"/></svg>`}<small>${d.photo?'TAP TO CHANGE':'TAP TO ADD PHOTO'}</small></div><input type="file" id="photo-in" accept="image/*" hidden><div class="kv">
      <b>Real name</b><span>${esc(d.real || "—")}</span>
      <b>Call sign</b><span>${esc(d.alias || "—")}</span>
      <b>Clearance</b><span>${esc(d.level)}</span>
      <b>Status</b><span>${esc(d.status)}</span>
      <b>Opened</b><span>${esc(d.createdDate)}</span>
      <b>Last contact</b><span>${esc(contact)}</span>
    </div>
    </div><div class="notes">${redact(d.notes || "No entries.")}</div><div class="barcode"></div>`;
  const ph=document.getElementById('photo'),pi=document.getElementById('photo-in');
  ph.onclick=()=>pi.click();
  pi.onchange=()=>{const f=pi.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,360/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);d.photo=c.toDataURL('image/jpeg',.8);sfx.shutter();save();openView(id)};im.src=r.result};r.readAsDataURL(f)};
  show("view-view");setTimeout(()=>{sfx.stamp();const w=document.querySelector('.wrap');w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake')},600);
}
function delCurrent(){
  const d = dossiers.find(x => x.id === currentId);
  if(!d) return;
  if(!confirm(`Destroy dossier “${d.code || d.real}”? This cannot be undone.`)) return;
  sfx.shred();removeDoc(currentId);dossiers = dossiers.filter(x => x.id !== currentId);
  save();
  renderList();
  show("list-view");
}

document.getElementById("new-btn").addEventListener("click", openNew);
document.getElementById("cancel-btn").addEventListener("click", () => { renderList(); show("list-view"); });
document.getElementById("save-btn").addEventListener("click", saveForm);
document.getElementById("back-btn").addEventListener("click", () => { renderList(); show("list-view"); });
document.getElementById("edit-btn").addEventListener("click", () => openEdit(currentId));
document.getElementById("del-btn").addEventListener("click", delCurrent);

load();
renderList();
var DB=null;
function removeDoc(id){if(DB)DB.doc('dossiers/'+id).delete().catch(e=>alert('Could not delete: '+(e&&e.message||e)))}
(async()=>{
  try{
    const c=await claude.use('db');
    if(!c)return;
    DB=c;
    document.getElementById('sync').textContent='● SHARED ARCHIVE · LIVE';
    let loc=[];
    try{if(localStorage.getItem(KEY+'-synced')!=='1')loc=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
    for(const d of loc){if(d&&d.id)await DB.doc('dossiers/'+d.id).set(JSON.parse(JSON.stringify(d))).catch(()=>{})}
    try{if(loc.length)localStorage.setItem(KEY+'-synced','1')}catch(e){}
    DB.collection('dossiers').onSnapshot(s=>{
      dossiers=s.docs.map(x=>({...x.data(),id:x.id}));
      dossiers.forEach(d=>{d.level=M[d.level]||d.level;d.status=M[d.status]||d.status});
      renderList();
      if(!document.getElementById('view-view').classList.contains('hidden')&&!dossiers.some(x=>x.id===currentId))show('list-view');
    },e=>console.error(e));
  }catch(e){}
})();
</script>
